# Include inside the http { } block.
# Rate-limit only top-level dashboard entry paths (/, /hub_slug/).
# Shiny assets, websockets, and nested paths are not limited.
#
# Loopback is never limited so Prometheus blackbox / nginx_exporter
# do not fill the mastr_entry zone.

map $remote_addr $mastr_is_loopback {
    default   0;
    127.0.0.1 1;
    ::1       1;
}

map $request_uri $mastr_uri_limited {
    default 0;
    ~^/?$ 1;
    ~^/nour-jobs(/|$) 0;
    ~^/(site_traffic|grafana|netdata|portal|about)/?$ 0;
    ~^/[^./?]+/?$ 1;
}

# Only non-loopback clients on limited URIs get a rate-limit key.
map "$mastr_is_loopback:$mastr_uri_limited" $mastr_limit_key {
    default "";
    "0:1"   $binary_remote_addr;
}

limit_req_zone $mastr_limit_key zone=mastr_entry:10m rate=60r/m;
limit_req_status 429;
