<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#e7e1d4"/>
  <meta name="description" content="One-screen public briefing of A Transformative AI Strategy for Europe (September 2026)."/>
  <title>Transformative AI — Europe in one screen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/transformative-ai/assets/app.css?v=4"/>
</head>
<body>
  <a class="skip" href="#story">Skip to explanation</a>
  <div class="stage">
    <header class="top">
      <a class="home" href="/">Tarek Chehade</a>
      <div class="title-block">
        <p class="eyebrow">Independent briefing · September 2026 · tap a lane</p>
        <h1>A Transformative AI Strategy for Europe</h1>
      </div>
      <div class="links">
        <a href="https://transformative-ai.eu/" target="_blank" rel="noopener">Source</a>
        <a class="pdf" href="https://transformative-ai.eu/download/a_transformative_ai_strategy_for_europe.pdf" target="_blank" rel="noopener">PDF</a>
      </div>
    </header>

    <div class="work">
      <nav class="rail" aria-label="Immediate objectives">
        <button class="lane on" data-id="why" type="button">
          <b>0</b>
          <span class="lane-name">Why now</span>
          <em>Diagnosis</em>
        </button>
        <button class="lane" data-id="io1" type="button">
          <b>1</b>
          <span class="lane-name">Alliance</span>
          <em>Supply chain</em>
        </button>
        <button class="lane" data-id="io2" type="button">
          <b>2</b>
          <span class="lane-name">Institutions</span>
          <em>Frontier inside</em>
        </button>
        <button class="lane" data-id="io3" type="button">
          <b>3</b>
          <span class="lane-name">Compute</span>
          <em>5% → 15%</em>
        </button>
        <button class="lane" data-id="io4" type="button">
          <b>4</b>
          <span class="lane-name">Resilience</span>
          <em>Cyber · bio</em>
        </button>
        <button class="lane" data-id="io5" type="button">
          <b>5</b>
          <span class="lane-name">Assurance</span>
          <em>Prove it</em>
        </button>
      </nav>

      <article class="story" id="story" tabindex="-1" aria-live="polite">
        <div class="story-head">
          <p class="kicker" id="kicker"></p>
          <h2 id="headline"></h2>
          <p class="lede" id="lede"></p>
        </div>
        <div class="metrics" id="metrics"></div>
        <div class="viz-slot" id="viz" hidden></div>
        <div class="paras" id="paras"></div>
        <ul class="points" id="points"></ul>
        <blockquote id="quote" hidden></blockquote>
      </article>
    </div>

    <footer class="dock">
      <button class="chip" data-id="p1" type="button"><b>Pillar 1</b> Frontier access</button>
      <button class="chip" data-id="p2" type="button"><b>Pillar 2</b> Economic strength</button>
      <button class="chip" data-id="p3" type="button"><b>Pillar 3</b> Safety &amp; workers</button>
      <p class="legal">Independent expert strategy (personal capacity). Not an EU Commission text.</p>
    </footer>
  </div>
  <script src="/transformative-ai/assets/app.js?v=4"></script>
</body>
</html>
