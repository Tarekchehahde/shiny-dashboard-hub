# Landing-page static files at site root.
# `/` is an exact location for index.html only; the Shiny catch-all would
# otherwise 404 these files. Keep in sync with /etc/nginx/sites-enabled/mastr-hub
# (that file is a copy, not a symlink).
#
# Deploy HTML/CSS/JS:
#   rsync -avz WORK/ops-portal/index.html WORK/ops-portal/landing.css \
#     WORK/ops-portal/landing.js WORK/ops-portal/mission-control.html \
#     ionos-mastr:/var/www/mastr-portal/

location = /landing.css {
    root /var/www/mastr-portal;
    default_type text/css;
}
location = /landing.js {
    root /var/www/mastr-portal;
    default_type application/javascript;
}
location = /mission-control.html {
    root /var/www/mastr-portal;
    default_type text/html;
}
