# nginx — barrier-free programming / data-science trial
# Public URLs:
#   https://82.165.167.86/barrierefrei/      (German)
#   https://82.165.167.86/barrierefrei/ar/   (Arabic)

location = /barrierefrei { return 301 /barrierefrei/; }
location = /barrierefrei/ar { return 301 /barrierefrei/ar/; }
location /barrierefrei/ {
    alias /var/www/mastr-portal/barrierefrei/;
    index index.html;
}

# Deploy:
#   rsync -avz WORK/ops-portal/barrierefrei/ ionos-mastr:/var/www/mastr-portal/barrierefrei/
#   ssh ionos-mastr 'nginx -t && systemctl reload nginx'
