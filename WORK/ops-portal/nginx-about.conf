# nginx snippet for personal About/CV page (add to mastr-hub site)

location = /cv { return 301 /about/; }
location = /about { return 301 /about/; }
location = /about/de { return 301 /about/de/; }
location /about/ {
    alias /var/www/mastr-portal/about/;
    index index.html;
}

# DEKRA Fahrprüfung study app (client password gate; optional nginx auth in snippet)
# Deploy: rsync -avz WORK/ops-portal/fahrpruefung/ ionos-mastr:/var/www/mastr-portal/fahrpruefung/
location = /fahrpruefung { return 301 /fahrpruefung/; }
location ^~ /fahrpruefung/ {
    alias /var/www/mastr-portal/fahrpruefung/;
    index index.html;
}

